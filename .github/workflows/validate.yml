name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Published version for comparison
        if: github.event_name == 'pull_request'
        run: git show "origin/${{ github.base_ref }}:hijri_corrections.json" > /tmp/base.json
      - name: Generated files are up to date
        run: python3 -I scripts/build.py --check
      - name: Safety rules
        run: python3 -I scripts/validate.py --base /tmp/base.json
